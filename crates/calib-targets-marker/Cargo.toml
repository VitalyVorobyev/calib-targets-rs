[package]
name = "calib-targets-marker"
version.workspace = true
description = "Checkerboard marker target detector (checkerboard + 3 central circles)"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation.workspace = true
keywords = ["calibration", "computer-vision", "marker", "chessboard", "circles"]
categories = ["computer-vision", "science"]

[features]
# Opt-in ONNX-backed subpixel refiner (`ChessRefiner::Ml`, upstream's
# `chess-corners/ml-refiner`). OFF by default: it drags the `tract` ONNX
# runtime into the build — which took the WASM bundle from ~0.85 MB to ~10 MB
# while nothing in this workspace ever selects the ML refiner — and on
# `wasm32-unknown-unknown` its transitive `getrandom` needs a backend chosen at
# build time. With the feature off, the serde value `{"refiner": "ml"}` does
# not deserialize; every other refiner is unaffected.
ml-refiner = ["chess-corners/ml-refiner"]
default = []
# Opt-in introspection surface: the `diagnostics` module, the diagnostics
# type re-export, and `MarkerBoardDetector::detect_with_diagnostics`. OFF by
# default, consistent with `calib-targets-chessboard` / `-charuco` /
# `-puzzleboard`. The detector still computes the diagnostics evidence
# internally (circle candidates/matches, per-corner provenance) — the
# feature only controls whether it reaches the public surface.
diagnostics = []
tracing = ["calib-targets-core/tracing", "dep:tracing"]

[dependencies]
calib-targets-core.workspace = true
calib-targets-chessboard.workspace = true
nalgebra = { workspace = true, features = ["serde-serialize"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true, optional = true }
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
chess-corners = { workspace = true, features = ["rayon"] }
image.workspace = true
projective-grid.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
