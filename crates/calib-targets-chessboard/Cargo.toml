[package]
name = "calib-targets-chessboard"
version.workspace = true
description = "Invariant-first chessboard detector built on top of ChESS corners"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation.workspace = true
keywords = ["calibration", "computer-vision", "chessboard", "detection", "grid"]
categories = ["computer-vision", "science"]

[features]
# Opt-in ONNX-backed subpixel refiner (`ChessRefiner::Ml`, upstream's
# `chess-corners/ml-refiner`). OFF by default: it drags the `tract` ONNX
# runtime into the build — which took the WASM bundle from ~0.85 MB to ~10 MB
# while nothing in this workspace ever selects the ML refiner — and on
# `wasm32-unknown-unknown` its transitive `getrandom` needs a backend chosen at
# build time. With the feature off, the serde value `{"refiner": "ml"}` does
# not deserialize; every other refiner is unaffected.
ml-refiner = ["chess-corners/ml-refiner"]
default = []
# Opt-in introspection surface: `trace_topological`, the topological grid
# builder's compact serializable trace of the final labelled components. OFF
# by default, consistent with `calib-targets-charuco` / `-puzzleboard` /
# `-marker`. The rich per-stage `DebugFrame` surface was retired with the
# seed-and-grow builder; `trace_topological` is the topological builder's
# sole diagnostic entry point.
diagnostics = []
dataset = ["dep:serde_json", "diagnostics"]
tracing = ["calib-targets-core/tracing", "projective-grid/tracing", "dep:tracing"]

[dependencies]
calib-targets-core.workspace = true
projective-grid.workspace = true
nalgebra.workspace = true
log.workspace = true
kiddo.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
calib-targets = { path = "../calib-targets" }
chess-corners = { workspace = true, features = ["rayon"] }
criterion.workspace = true
env_logger.workspace = true
image.workspace = true
serde_json.workspace = true

[[bench]]
name = "chessboard_timing"
harness = false

[[bench]]
name = "dataset_corners"
harness = false

[[bench]]
name = "dataset_chessboard"
harness = false

# Exercises `trace_topological`, which lives behind the opt-in `diagnostics`
# feature.
[[test]]
name = "topo_grid_regression"
required-features = ["diagnostics"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
