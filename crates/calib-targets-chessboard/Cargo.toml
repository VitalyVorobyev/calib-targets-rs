[package]
name = "calib-targets-chessboard"
version.workspace = true
description = "Invariant-first chessboard detector built on top of ChESS corners"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation.workspace = true
keywords = ["calibration", "computer-vision", "chessboard", "detection", "grid"]
categories = ["computer-vision", "science"]

[features]
# Opt-in: derive `schemars::JsonSchema` for the serde-serializable config types
# so a JSON Schema of the configs can be generated (`cargo xtask emit-schemas`).
schemars = ["dep:schemars", "projective-grid/schemars", "calib-targets-core/schemars"]
default = []
# Opt-in introspection surface: `trace_topological`, the topological grid
# builder's compact serializable trace of the final labelled components. OFF
# by default, consistent with `calib-targets-charuco` / `-puzzleboard` /
# `-marker`. The rich per-stage `DebugFrame` surface was retired with the
# seed-and-grow builder; `trace_topological` is the topological builder's
# sole diagnostic entry point.
diagnostics = ["projective-grid/diagnostics"]
dataset = ["dep:serde_json", "diagnostics"]
tracing = ["calib-targets-core/tracing", "projective-grid/tracing", "dep:tracing"]

[dependencies]
schemars = { workspace = true, optional = true }
calib-targets-core.workspace = true
projective-grid.workspace = true
chess-corners = { workspace = true, features = ["rayon"] }
nalgebra.workspace = true
log.workspace = true
kiddo.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
calib-targets = { path = "../calib-targets" }
criterion.workspace = true
env_logger.workspace = true
image.workspace = true
serde_json.workspace = true

[[bench]]
name = "chessboard_timing"
harness = false

[[bench]]
name = "dataset_corners"
harness = false

[[bench]]
name = "dataset_chessboard"
harness = false

# Exercises `trace_topological`, which lives behind the opt-in `diagnostics`
# feature.
[[test]]
name = "topo_grid_regression"
required-features = ["diagnostics"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
