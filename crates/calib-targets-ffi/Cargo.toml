[package]
name = "calib-targets-ffi"
# Version pinned (not inherited) because the C ABI evolves
# independently of the Rust crate workspace. v1.0.0 marked the
# args/buffers struct redesign of the `*_detect_all` entry points
# (breaking change vs the 0.8 surface). v2.0.0 drops a now-dead field
# from `ct_charuco_detector_params_t` (a struct-layout-breaking ABI
# change) after the legacy ChArUco vote matcher — its sole consumer —
# was retired; see the CHANGELOG Breaking section for details. v3.0.0
# follows the chess-corners 1.0 migration: `ct_chess_params_t` collapses
# `threshold_rel` + `threshold_abs` into one absolute `threshold` and drops
# `descriptor_use_radius10`, `ct_chessboard_advanced_t` drops
# `max_fit_rms_ratio`, and the now-unused `ct_optional_bool_t` type is
# removed — three struct-layout-breaking changes. v4.0.0 renames the three
# `ct_*_detector_detect_diagnostics_json` entry points to
# `ct_*_detector_diagnose_json` (exported-symbol renames), and grows two
# PuzzleBoard structs: `ct_puzzleboard_decode_config_t` gains `symmetry_mode`
# and `ct_puzzleboard_result_t` gains the three period-3 consensus fields —
# both struct-layout-breaking. v5.0.0 reshapes the marker-board surface after
# issue #96: `ct_marker_board_layout_t` gains `circle_diameter_rel` — the one
# place the printed disk size is now stated — `ct_circle_score_params_t` loses
# the `diameter_frac` copy of it, and `ct_circle_match_params_t` loses
# `max_distance_cells`, a pre-alignment cell-distance gate the new
# hypothesis-and-verify frame search has no use for. Three struct-layout
# breaking changes.
version = "5.0.0"
description = "C ABI scaffold for calib-targets"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-ffi-header"
path = "src/bin/generate-ffi-header.rs"
required-features = ["generate-header"]

[features]
generate-header = ["dep:cbindgen"]

[dependencies]
# The C ABI cannot express Cargo features, so the FFI crate enables
# `diagnostics` unconditionally: the diagnostic JSON entry points
# (`ct_*_detector_diagnose_json`) are always present and the
# generated header is stable across build configurations.
calib-targets = { workspace = true, features = ["image", "diagnostics"] }
cbindgen = { workspace = true, optional = true }
chess-corners.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
zip.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true
