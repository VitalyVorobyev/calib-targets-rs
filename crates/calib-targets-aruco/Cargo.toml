[package]
name = "calib-targets-aruco"
version.workspace = true
description = "Embedded ArUco/AprilTag dictionaries and fast marker decoding on rectified grids"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation.workspace = true
keywords = ["calibration", "computer-vision", "aruco", "apriltag", "marker"]
categories = ["computer-vision", "science"]

[features]
# Opt-in ONNX-backed subpixel refiner (`ChessRefiner::Ml`, upstream's
# `chess-corners/ml-refiner`). OFF by default: it drags the `tract` ONNX
# runtime into the build — which took the WASM bundle from ~0.85 MB to ~10 MB
# while nothing in this workspace ever selects the ML refiner — and on
# `wasm32-unknown-unknown` its transitive `getrandom` needs a backend chosen at
# build time. With the feature off, the serde value `{"refiner": "ml"}` does
# not deserialize; every other refiner is unaffected.
ml-refiner = ["chess-corners/ml-refiner"]
tracing = ["calib-targets-core/tracing", "dep:tracing"]

[dependencies]
calib-targets-core.workspace = true
nalgebra = { workspace = true, features = ["serde-serialize"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
log.workspace = true
tracing = { workspace = true, optional = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
image.workspace = true
chess-corners = { workspace = true, features = ["rayon"] }
calib-targets-chessboard.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
