[package]
name = "calib-targets-puzzleboard"
version.workspace = true
description = "PuzzleBoard self-identifying chessboard target detector (Stelldinger 2024)"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation.workspace = true
keywords = ["calibration", "computer-vision", "puzzleboard", "chessboard", "de-bruijn"]
categories = ["computer-vision", "science"]

[features]
# Opt-in ONNX-backed subpixel refiner (`ChessRefiner::Ml`, upstream's
# `chess-corners/ml-refiner`). OFF by default: it drags the `tract` ONNX
# runtime into the build — which took the WASM bundle from ~0.85 MB to ~10 MB
# while nothing in this workspace ever selects the ML refiner — and on
# `wasm32-unknown-unknown` its transitive `getrandom` needs a backend chosen at
# build time. With the feature off, the serde value `{"refiner": "ml"}` does
# not deserialize; every other refiner is unaffected.
ml-refiner = ["chess-corners/ml-refiner"]
default = []
# Opt-in introspection surface: the `diagnostics` module, the diagnostics
# type re-exports, and `PuzzleBoardDetector::detect_with_diagnostics`. OFF by
# default, consistent with `calib-targets-chessboard`. The detector still
# captures the diagnostics internally for best-component selection; the feature
# only controls whether they reach the public surface.
diagnostics = []
# The `run_dataset` example + dataset harness consume both the chessboard
# detector's per-frame `DebugFrame` and the puzzleboard
# `detect_with_diagnostics` tuple, so enable both diagnostics surfaces.
dataset = ["calib-targets-chessboard/diagnostics", "diagnostics"]
tracing = ["calib-targets-core/tracing", "dep:tracing"]

[dependencies]
calib-targets-core.workspace = true
calib-targets-chessboard.workspace = true
chess-corners = { workspace = true, features = ["rayon"] }
nalgebra.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
calib-targets = { path = "../calib-targets" }
calib-targets-core.workspace = true
calib-targets-print = { path = "../calib-targets-print" }
criterion.workspace = true
env_logger.workspace = true
image.workspace = true
log.workspace = true
projective-grid.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "dataset_decode"
harness = false
# Times the chessboard and puzzleboard detectors over the dataset fixtures;
# gated behind `dataset` for the puzzleboard diagnostics + fixture harness.
required-features = ["dataset"]

[[bench]]
name = "synthetic_decode"
harness = false
# Public counterpart to `dataset_decode`: times corner → chessboard → decode on
# the committed photo-realistic synthetic fixtures (canonical-map renders). No
# feature gate and no private data, so `cargo bench --workspace` runs it.

[[bin]]
name = "generate-puzzleboard-code-maps"
path = "tools/generate_code_maps.rs"

[[bin]]
name = "verify-puzzleboard-code-maps"
path = "tools/verify_code_maps.rs"

[[bin]]
name = "import-author-puzzleboard-maps"
path = "tools/import_author_maps.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
