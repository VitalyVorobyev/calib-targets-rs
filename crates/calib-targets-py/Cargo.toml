[package]
name = "calib-targets-py"
version.workspace = true
description = "Python bindings for chess-corners"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
publish = false
autobins = false

[lib]
name = "calib_targets"
crate-type = ["cdylib"]
doc = false

[features]
# Opt-in ONNX-backed subpixel refiner; see the note in `calib-targets`.
# OFF by default so the wheel does not carry the `tract` ONNX runtime.
# With it off, a `ChessRefiner(kind="ml")` config is rejected at
# deserialization rather than silently downgraded.
ml-refiner = ["chess-corners/ml-refiner", "calib-targets/ml-refiner"]

[dependencies]
# The Python bindings expose the full detector surface, including the
# chessboard `*_with_diagnostics` entry points, so they enable `diagnostics`
# unconditionally (the bindings have no Cargo feature of their own).
calib-targets = { workspace = true, features = ["image", "diagnostics"] }
chess-corners = { workspace = true, features = ["rayon"] }
image.workspace = true
numpy.workspace = true
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[lints]
workspace = true
