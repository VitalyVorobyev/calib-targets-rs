[project]
name = "pbrings"
version = "0.1.0"
description = "Numerical study of PuzzleBoard de Bruijn rings — standalone research, not part of calib-targets"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]

[project.scripts]
pbr = "pbrings.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbrings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exhaustive full-size checks; deselect with -m 'not slow'"]
