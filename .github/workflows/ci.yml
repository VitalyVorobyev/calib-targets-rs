name: ci

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Add rustfmt and clippy (stable only)
        if: matrix.toolchain == 'stable'
        run: rustup component add rustfmt clippy

      - name: fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check

      - name: clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check generated FFI header
        if: matrix.toolchain == 'stable'
        run: cargo run -p calib-targets-ffi --features generate-header --bin generate-ffi-header -- --check

      - name: CMake consumer smoke
        if: matrix.toolchain == 'stable'
        run: cargo test -p calib-targets-ffi --test cmake_consumer_smoke -- --nocapture

      # Every crate has off-by-default features, and until 0.14.0 nothing built
      # them: `--all-targets` above compiles default features only, and the
      # `--all-features` gate runs at release time. So `link_check` — behind
      # `link-check`, off by default — sat broken on `main` after a
      # `#[non_exhaustive]` struct gained a field, with five green checks.
      #
      # This enables every *local* feature and deliberately omits `ml-refiner`,
      # whose `tract` ONNX runtime is what makes `--all-features` too slow to
      # run per-PR. It compiles in seconds and would have caught that break.
      - name: check (every local feature, no ml-refiner)
        if: matrix.toolchain == 'stable'
        run: >
          cargo check --workspace --all-targets --features
          calib-targets-aruco/tracing,calib-targets-charuco/diagnostics,calib-targets-charuco/link-check,calib-targets-charuco/dataset,calib-targets-charuco/tracing,calib-targets-chessboard/diagnostics,calib-targets-chessboard/dataset,calib-targets-chessboard/tracing,calib-targets-core/tracing,calib-targets-marker/diagnostics,calib-targets-marker/tracing,calib-targets-puzzleboard/diagnostics,calib-targets-puzzleboard/dataset,calib-targets-puzzleboard/tracing,calib-targets/image,calib-targets/cli,calib-targets/diagnostics,calib-targets/tracing,projective-grid/diagnostics,projective-grid/tracing,calib-targets-ffi/generate-header

      - name: test (all crates, default features)
        # Keep --all-targets: besides lib/integration tests it RUNS the
        # harness=false Criterion benches in test mode (one iteration), which
        # exercise real detector paths (unwrap/expect) — smoke coverage that
        # clippy --all-targets (lint-only) does not provide. The test job is
        # fast despite this thanks to the [profile.test.package.*] opt-levels
        # in the root Cargo.toml.
        run: cargo test --workspace --all-targets

  msrv:
    # Verify the declared MSRV (`rust-version` in the root Cargo.toml) actually
    # builds. Cargo never cross-checks `rust-version` against dependencies'
    # own floors, so the declaration rots silently when an upstream bumps
    # theirs — exactly how 1.88 went stale once chess-corners 1.1 moved to
    # 1.91. `cargo check --workspace` mirrors what a consumer building on the
    # MSRV toolchain compiles. Keep the version here in sync with
    # `rust-version` in Cargo.toml.
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins `stable`; RUSTUP_TOOLCHAIN outranks it.
      RUSTUP_TOOLCHAIN: "1.91"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: check (MSRV)
        run: cargo check --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build crates/calib-targets-wasm --target web --release --out-dir ../../demo/pkg --out-name calib_targets_wasm

      - name: Append object-shape TypeScript declarations
        run: |
          cat crates/calib-targets-wasm/typescript-extras.d.ts \
            >> demo/pkg/calib_targets_wasm.d.ts

      - name: Set scoped npm package name
        working-directory: demo/pkg
        run: npm pkg set name=@vitavision/calib-targets

      - name: Verify WASM output
        run: |
          test -f demo/pkg/calib_targets_wasm.js
          test -f demo/pkg/calib_targets_wasm_bg.wasm
          test -f demo/pkg/calib_targets_wasm.d.ts
          ls -lh demo/pkg/calib_targets_wasm_bg.wasm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build demo app
        working-directory: demo
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bunx vite build

      # Two checks, and the second is the one that bites. Type-checking the
      # `.d.ts` proves it *parses*; it cannot see a declaration that is
      # unsatisfiable. TypeScript silently merges two same-named `interface`
      # declarations in one module, which is how `MarkerCircleSpec` came to be
      # declared twice — once for the printable model, once for the detector —
      # leaving a merged interface requiring the fields of both, so neither
      # marker-board type could be constructed. `typescript-extras.check.ts`
      # builds a value of each exported shape, which is what catches that.
      - name: Type-check hand-written WASM TypeScript declarations
        working-directory: demo
        run: >
          bunx tsc --noEmit --strict --skipLibCheck
          ../crates/calib-targets-wasm/typescript-extras.d.ts

      - name: Check the declarations can actually be constructed
        working-directory: demo
        run: >
          bunx tsc --noEmit --strict --skipLibCheck
          ../crates/calib-targets-wasm/typescript-extras.check.ts

  python-bindings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Python 3.10 (PyO3)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin numpy pytest pyright mypy Pillow

      - name: Check generated typing artifacts
        run: python crates/calib-targets-py/tools/generate_typing_artifacts.py --check

      - name: Build and install Python bindings
        run: maturin develop -m crates/calib-targets-py/Cargo.toml

      - name: Python tests
        run: pytest crates/calib-targets-py/python_tests

      - name: Pyright smoke check
        run: pyright crates/calib-targets-py/python_tests/typecheck_smoke.py

      - name: mypy smoke check
        run: mypy crates/calib-targets-py/python_tests/typecheck_smoke.py

  # Supply-chain gate. The scheduled `audit.yml` workflow still runs weekly and
  # files an issue for newly-published advisories against the existing
  # lockfile; this job is the *pre-merge* half, so a PR that introduces a
  # vulnerable, unmaintained, wrongly-licensed, or unvendored dependency fails
  # review instead of surfacing days later.
  #
  # `cargo deny check` covers advisories (same RustSec database as
  # `cargo audit`) *plus* licences, bans, and sources, and it is the only one
  # of the two that reads `deny.toml`. Running `cargo audit` here as well
  # would mean maintaining a second, separate ignore list that could silently
  # drift from `deny.toml`, so `deny.toml` is the single source of truth for
  # policy and documented exceptions.
  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check
