name: Publish Rust Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:     # allow manual trigger / republish

# NOTE: deliberately NOT triggered on tag pushes. Release tags (`vX.Y.Z`,
# `projective-grid-vX.Y.Z`, `wasm-vX.Y.Z`) are always cut from a commit that is
# already on `main`, so
# the `main` push has published byte-identical docs moments earlier. Firing
# on tags as well meant a release pushed 2-3 refs at the same commit within
# seconds, producing concurrent GitHub Pages deployments; the `concurrency`
# group below serialises the *workflow runs*, but the Pages API still
# rejected the redundant deployments ("Deployment failed, try again later"),
# which is exactly how the v0.10.1 release failed on both `main` and
# `wasm-v0.10.1`. Publishing from `main` alone removes the race by
# construction. Use `workflow_dispatch` to republish on demand.

permissions:
  contents: read
  pages: write
  id-token: write        # required for OIDC deploy authentication

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
          targets: wasm32-unknown-unknown

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --all-features --no-deps
          echo '<meta http-equiv="refresh" content="0; url=calib_targets_core/index.html">' > target/doc/index.html
          mdbook build book

      - name: Build demo (WASM + Vite)
        run: |
          ./scripts/build-wasm.sh
          cd demo
          bun install --frozen-lockfile
          bun run build

      - name: Assemble Pages artifact
        run: |
          # Landing page (.github/pages/index.html) is the site root; it also
          # carries img/ and the performance/ report. mdBook moves off the root
          # into /book/ so the landing page can own /.
          mkdir -p public/api public/book public/demo
          rsync -a .github/pages/ public/
          rsync -a target/doc/    public/api/
          rsync -a book/book/     public/book/
          rsync -a demo/dist/     public/demo/

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
