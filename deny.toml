# `cargo deny` policy for the calib-targets workspace.
#
# Run locally (and in CI on every PR) as:
#
#     cargo deny check
#
# This is the gate, not `cargo audit`, and the difference matters. `audit`
# scans `Cargo.lock`, which by design records optional dependencies even when
# their features are disabled. `deny` resolves the enabled feature graph first,
# so it reports what we actually compile. `paste` can still appear in the lock
# through `image`'s disabled AVIF dependency, but `cargo tree -i paste` must be
# empty. `deny` additionally enforces licence policy, duplicate-version
# hygiene, and source allow-listing.
#
# Policy note: an entry in `advisories.ignore` is a *documented, dated
# exception*, never a way to silence a finding we could fix. Every entry
# below states who pulls the crate in and what unblocks its removal.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No exceptions are currently in force. RUSTSEC-2024-0436 (`paste`,
# unmaintained) has no exception. `image` defaults stay disabled and both
# feature paths that currently pull it in — AVIF (`rav1e`) and OpenEXR
# (`exr` → `pulp`) — are disabled. See the `image` entry in the root
# `Cargo.toml`.
ignore = []

[licenses]
version = 2
# The workspace itself is MIT OR Apache-2.0;;these are the permissive
# licences we accept from the dependency graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of the same crate are common and mostly harmless in a
# graph this size (image/tract/pyo3 pull wide trees), so warn rather than
# deny; the signal we care about here is the wildcard check below.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
