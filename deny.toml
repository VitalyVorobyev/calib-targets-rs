# `cargo deny` policy for the calib-targets workspace.
#
# Run locally (and in CI on every PR) as:
#
#     cargo deny check
#
# This complements `cargo audit`: `audit` answers "is anything in the
# lockfile subject to a RustSec advisory", `deny` additionally enforces
# licence policy, duplicate-version hygiene, and source allow-listing.
#
# Policy note: an entry in `advisories.ignore` is a *documented, dated
# exception*, never a way to silence a finding we could fix. Every entry
# below states who pulls the crate in and what unblocks its removal.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436 — `paste` is unmaintained (informational only; no
    # known vulnerability, no patched release exists).
    #
    # Not reachable from any code this workspace writes. It arrives as:
    #
    #     paste <- rav1e <- ravif <- image (feature "avif")
    #
    # `image`'s "avif" feature is pulled in by `image/default` ->
    # "default-formats". We set `default-features = true` on our own `image`
    # dependency, but narrowing that alone does NOT drop the edge: the
    # `chess-corners` crate also depends on `image` without
    # `default-features = false`, and Cargo unifies features across the
    # graph. Verified with `cargo tree -i ravif -e features`.
    #
    # Unblocked by an upstream one-liner in chess-corners: depend on `image`
    # with `default-features = false` plus an explicit codec list. Filed as
    # VitalyVorobyev/chess-corners-rs#68. Once that ships, bump chess-corners,
    # mirror `default-features = false` on our own `image` dependency (BOTH are
    # required — feature unification means narrowing either one alone leaves
    # the edge), then delete this ignore and close #35.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# The workspace itself is MIT OR Apache-2.0;;these are the permissive
# licences we accept from the dependency graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    # NCSA (University of Illinois/NCSA Open Source License) — permissive,
    # OSI-approved, BSD-like. Reaches the graph only as
    # `libfuzzer-sys <- rav1e <- ravif <- image (feature "avif")`, the same
    # AVIF-encoder chain described in `advisories.ignore` above.
    "NCSA",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of the same crate are common and mostly harmless in a
# graph this size (image/tract/pyo3 pull wide trees), so warn rather than
# deny; the signal we care about here is the wildcard check below.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
