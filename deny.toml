# `cargo deny` policy for the calib-targets workspace.
#
# Run locally (and in CI on every PR) as:
#
#     cargo deny check
#
# This is the gate, not `cargo audit`, and the difference matters. `audit`
# scans `Cargo.lock`, which by design records every *optional* dependency
# whether or not any enabled feature actually pulls it in. `deny` resolves
# real features first, so it reports what we actually compile. Concretely:
# `cargo audit` still warns about `paste` via `rav1e ← ravif ← image`, but
# that edge only exists behind `image`'s `avif` feature, which nothing in
# this workspace enables — `cargo tree -i paste` is empty and `paste` is not
# built. `deny` sees this correctly; `audit` cannot. `deny` additionally
# enforces licence policy, duplicate-version hygiene, and source
# allow-listing.
#
# Policy note: an entry in `advisories.ignore` is a *documented, dated
# exception*, never a way to silence a finding we could fix. Every entry
# below states who pulls the crate in and what unblocks its removal.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No exceptions are currently in force. RUSTSEC-2024-0436 (`paste`,
# unmaintained) was ignored here until chess-corners 1.1 stopped enabling
# `image/default`; with that plus `default-features = false` on our own
# `image` dependency, the AVIF encoder — and with it `rav1e`/`paste` — is out
# of the graph entirely. See the `image` entry in the root `Cargo.toml`.
ignore = []

[licenses]
version = 2
# The workspace itself is MIT OR Apache-2.0;;these are the permissive
# licences we accept from the dependency graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of the same crate are common and mostly harmless in a
# graph this size (image/tract/pyo3 pull wide trees), so warn rather than
# deny; the signal we care about here is the wildcard check below.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
